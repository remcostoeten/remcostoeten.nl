name: Spotify sync

on:
    schedule:
        - cron: '17 * * * *'
    workflow_dispatch:

jobs:
    sync:
        runs-on: ubuntu-latest
        timeout-minutes: 2

        steps:
            - name: Save recent Spotify plays
              env:
                  CRON_SECRET: ${{ secrets.CRON_SECRET }}
              run: |
                  curl --fail-with-body --silent --show-error --max-time 60 \
                      --header "Authorization: Bearer $CRON_SECRET" \
                      https://www.remcostoeten.nl/api/spotify/sync
